name: Validate discounts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_discounts.py
      - name: Check JSON files parse
        run: for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
